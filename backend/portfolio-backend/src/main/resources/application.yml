server:
  port: ${PORT:${BACKEND_PORT:8080}}
  forward-headers-strategy: framework
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

spring:
  application:
    name: portfolio-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  security:
    user:
      name: admin
      password: ${SPRING_SECURITY_USER_PASSWORD:admin123}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

---
# ===== LOCAL profile (run backend OUTSIDE Docker) =====
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:portfolio_db}
    username: ${POSTGRES_USER:portfolio_user}
    password: ${POSTGRES_PASSWORD:portfolio_pass}

  jpa:
    hibernate:
      ddl-auto: update   # OK for local dev
    properties:
      hibernate:
        format_sql: true

  flyway:
    validateOnMigrate: false
    outOfOrder: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

---
# ===== PROD profile (Docker / Render / Neon) =====
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # safer for prod

  flyway:
    validateOnMigrate: false
    outOfOrder: false
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS}
  admin:
    email: ${APP_ADMIN_EMAIL}
    password: ${APP_ADMIN_PASSWORD}
  email:
    from: ${GMAIL_USERNAME}
    to: ${GMAIL_RECIPIENT_EMAIL}
