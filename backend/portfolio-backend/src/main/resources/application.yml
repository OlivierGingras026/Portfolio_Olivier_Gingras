server:
  port: ${PORT:${BACKEND_PORT:8080}}
  forward-headers-strategy: framework

spring:
  application:
    name: portfolio-backend

  security:
    user:
      name: admin
      password: admin123

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production-at-least-64-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

---
# ===== LOCAL profile (run backend OUTSIDE Docker) =====
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:portfolio_db}
    username: ${POSTGRES_USER:portfolio_user}
    password: ${POSTGRES_PASSWORD:portfolio_pass}

  jpa:
    hibernate:
      ddl-auto: update   # OK for local dev
    properties:
      hibernate:
        format_sql: true

---
# ===== PROD profile (Docker / Render / Neon) =====
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # safer for prod
