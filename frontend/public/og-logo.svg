<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGradient)"/>
  
  <!-- Geometric accent shapes -->
  <path d="M 100 30 Q 130 60 160 90" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 40 100 Q 70 130 100 160" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Inner circle border with gradient -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
  
  <!-- OG Text with gradient -->
  <text x="100" y="115" font-family="'Arial', 'Helvetica', sans-serif" font-size="72" font-weight="800" fill="url(#textGradient)" text-anchor="middle" dominant-baseline="middle" letter-spacing="2" filter="url(#glow)">
    OG
  </text>
  
  <!-- Subtle corner accents -->
  <circle cx="40" cy="40" r="3" fill="#60a5fa" opacity="0.6"/>
  <circle cx="160" cy="160" r="3" fill="#60a5fa" opacity="0.6"/>
  <circle cx="160" cy="40" r="2" fill="#3b82f6" opacity="0.4"/>
  <circle cx="40" cy="160" r="2" fill="#3b82f6" opacity="0.4"/>
  
  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.3"/>
</svg>