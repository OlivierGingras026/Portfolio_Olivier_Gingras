server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html index.htm;

  # Proxy API calls to Spring Boot
  location /api/ {
    proxy_pass http://portfolio_backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Cache static assets (JS, CSS, images)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
    add_header Cache-Control "max-age=31536000, immutable";
    access_log off;
  }

  # Disable cache for index.html
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # React SPA fallback - if file doesn't exist, serve index.html
  location / {
    # Check if the request is for an actual file
    if (!-f $request_filename) {
      # Check if it's not a directory
      if (!-d $request_filename) {
        # Serve index.html (SPA fallback)
        rewrite ^(.*)$ /index.html break;
      }
    }
  }
}
